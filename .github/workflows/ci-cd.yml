name: CI/CD - YanXiDao Admin Platform & API Server

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - name: Run E2E regression tests
        run: |
          PORT=3001 npm run start:prod &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/api/health >/dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
          kill $SERVER_PID || true

  docker-build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: yanxidao-admin-platform:${{ github.ref_name }}
