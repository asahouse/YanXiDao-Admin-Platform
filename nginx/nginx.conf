limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # Optional IP allowlist for /admin & /api/admin (uncomment and set your office/VPN CIDR in production)
    # location ~ ^/(admin|api/admin) {
    #     allow 10.0.0.0/8;
    #     deny all;
    # }

    location /api/admin/ {
        limit_req zone=admin_limit burst=20 nodelay;
        proxy_pass http://app:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://app:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://app:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
